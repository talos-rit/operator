name: talos-arms
x-common:
  image: talos-arms:demo-v1
  network_mode: host
  restart: 'no'
  stop_signal: SIGINT
  stop_grace_period: 8s
  security_opt: &id001
  - no-new-privileges:true
  logging: &id002
    driver: json-file
    options:
      max-size: 5m
      max-file: '2'
services:
  bluey-operator:
    image: talos-arms:demo-v1
    network_mode: host
    restart: 'no'
    stop_signal: SIGINT
    stop_grace_period: 8s
    security_opt: *id001
    logging: *id002
    profiles:
    - bluey
    environment:
      ERV_CONTROLLER_PROFILE: esp-one-axis
    command:
    - /opt/talos/erv
    - /opt/talos/configs/bluey.conf
    devices:
    - /dev/talos-bluey-serial:/dev/arm
    cpus: 0.25
    volumes:
    - ./logs/bluey:/logs
    mem_limit: 32m
    pids_limit: 128
  bluey-camera:
    image: talos-arms:demo-v1
    network_mode: host
    restart: 'no'
    stop_signal: SIGINT
    stop_grace_period: 8s
    security_opt: *id001
    logging: *id002
    profiles:
    - bluey
    entrypoint:
    - ffmpeg
    command:
    - -hide_banner
    - -nostats
    - -f
    - v4l2
    - -threads
    - '1'
    - -filter_threads
    - '1'
    - -input_format
    - mjpeg
    - -video_size
    - 1280x720
    - -framerate
    - '30'
    - -i
    - /dev/camera
    - -vf
    - fps=10
    - -pix_fmt
    - yuv420p
    - -c:v
    - h264_v4l2m2m
    - -b:v
    - 3M
    - -g
    - '10'
    - -bf
    - '0'
    - -f
    - rtsp
    - -rtsp_transport
    - tcp
    - rtsp://127.0.0.1:8554/camera
    devices:
    - /dev/talos-bluey-camera:/dev/camera
    - /dev/video11:/dev/video11
    cpus: 0.75
    mem_limit: 128m
    pids_limit: 128
  bluey-vision:
    image: talos-arms:demo-v1
    network_mode: host
    restart: 'no'
    stop_signal: SIGINT
    stop_grace_period: 8s
    security_opt: *id001
    logging: *id002
    profiles:
    - bluey
    depends_on:
    - bluey-operator
    - bluey-camera
    environment:
      POSE_THREADS: '1'
      POSE_SPINNING: '0'
      CAMERA_SOURCE: rtsp://127.0.0.1:8554/camera
    command:
    - python
    - main.py
    - --model
    - /opt/talos/model.onnx
    - --port
    - '5051'
    - --host
    - '::'
    - --operator-port
    - '61616'
    - --edge-control
    - --inference-fps
    - '${TALOS_INFERENCE_FPS:-2}'
    - --processing-width
    - '640'
    cpus: 2.5
    mem_limit: 512m
    pids_limit: 128
  bingo-operator:
    image: talos-arms:demo-v1
    network_mode: host
    restart: 'no'
    stop_signal: SIGINT
    stop_grace_period: 8s
    security_opt: *id001
    logging: *id002
    profiles:
    - bingo
    environment:
      ERV_CONTROLLER_PROFILE: native
    command:
    - /opt/talos/erv
    - /opt/talos/configs/bingo.conf
    devices:
    - /dev/talos-bingo-serial:/dev/arm
    cpus: 0.25
    volumes:
    - ./logs/bingo:/logs
    mem_limit: 32m
    pids_limit: 128
  bingo-camera:
    image: talos-arms:demo-v1
    network_mode: host
    restart: 'no'
    stop_signal: SIGINT
    stop_grace_period: 8s
    security_opt: *id001
    logging: *id002
    profiles:
    - bingo
    entrypoint:
    - ffmpeg
    command:
    - -hide_banner
    - -nostats
    - -f
    - v4l2
    - -threads
    - '1'
    - -filter_threads
    - '1'
    - -input_format
    - mjpeg
    - -video_size
    - 1280x720
    - -framerate
    - '30'
    - -i
    - /dev/camera
    - -vf
    - fps=10
    - -pix_fmt
    - yuv420p
    - -c:v
    - h264_v4l2m2m
    - -b:v
    - 3M
    - -g
    - '10'
    - -bf
    - '0'
    - -f
    - rtsp
    - -rtsp_transport
    - tcp
    - rtsp://127.0.0.1:8554/bingo
    devices:
    - /dev/talos-bingo-camera:/dev/camera
    - /dev/video11:/dev/video11
    cpus: 0.75
    mem_limit: 128m
    pids_limit: 128
  bingo-vision:
    image: talos-arms:demo-v1
    network_mode: host
    restart: 'no'
    stop_signal: SIGINT
    stop_grace_period: 8s
    security_opt: *id001
    logging: *id002
    profiles:
    - bingo
    depends_on:
    - bingo-operator
    - bingo-camera
    environment:
      POSE_THREADS: '1'
      POSE_SPINNING: '0'
      CAMERA_SOURCE: rtsp://127.0.0.1:8554/bingo
    command:
    - python
    - main.py
    - --model
    - /opt/talos/model.onnx
    - --port
    - '5052'
    - --host
    - '::'
    - --operator-port
    - '61617'
    - --edge-control
    - --inference-fps
    - '${TALOS_INFERENCE_FPS:-2}'
    - --processing-width
    - '640'
    cpus: 2.5
    mem_limit: 512m
    pids_limit: 128
